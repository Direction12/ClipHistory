<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 纯本地应用：只允许自身资源；不加载任何外部内容（见 docs/编码规范.md §6） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: clipimg:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>历史粘贴</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="search">
          <span class="search__icon" aria-hidden="true">🔍</span>
          <input
            id="search-input"
            class="search__input"
            type="search"
            placeholder="搜索历史…"
            aria-label="搜索历史"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="segments" role="group" aria-label="类型筛选">
          <button class="segment is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="segment" type="button" data-filter="text" aria-pressed="false">文字</button>
          <button class="segment" type="button" data-filter="image" aria-pressed="false">图片</button>
        </div>

        <button id="settings-button" class="icon-button" type="button" title="设置" aria-label="设置">⚙️</button>
      </header>

      <div id="paused-banner" class="banner banner--warn" hidden>
        <span>记录已暂停：新的复制内容不会被保存</span>
        <button id="resume-button" class="text-button" type="button">恢复记录</button>
      </div>

      <main id="list" class="list" aria-label="剪贴板历史列表" tabindex="-1"></main>

      <footer class="statusbar">
        <span id="status-text" class="status status--pending">正在加载…</span>
        <span class="statusbar__spacer"></span>
        <span id="status-count" class="status status--muted"></span>
        <button id="refresh-button" class="text-button" type="button" title="刷新列表">刷新</button>
      </footer>
    </div>

    <!-- 设置面板：单个弹层，不做弹窗套弹窗（见 docs/设计规范.md §10） -->
    <div id="settings-panel" class="panel" hidden>
      <div class="panel__header">
        <h2 class="panel__title">设置</h2>
        <button id="settings-close" class="icon-button" type="button" title="关闭" aria-label="关闭">✕</button>
      </div>

      <div class="panel__body">
        <section class="field">
          <div class="field__label">保存期限</div>
          <div class="field__hint">超过期限且未置顶的记录会被自动清理；置顶记录永久保留。</div>
          <div class="presets" role="group" aria-label="保存期限预设">
            <button class="preset" type="button" data-days="1">1 天</button>
            <button class="preset" type="button" data-days="3">3 天</button>
            <button class="preset" type="button" data-days="5">5 天</button>
          </div>
          <div class="custom-days">
            <label class="field__hint" for="custom-days-input">自定义（1–365 天）</label>
            <input id="custom-days-input" class="number-input" type="number" min="1" max="365" step="1" />
            <button id="apply-days-button" class="text-button" type="button">应用</button>
          </div>
          <div id="retention-current" class="field__hint"></div>
        </section>

        <section class="field">
          <div class="field__label">窗口置顶</div>
          <div class="field__hint">开启后窗口始终显示在最前，点击其它程序时不会被遮挡。</div>
          <label class="toggle">
            <input id="always-on-top" type="checkbox" />
            <span>让窗口始终显示在最前</span>
          </label>
        </section>

        <section class="field">
          <div class="field__label">窗口透明度</div>
          <div class="field__hint">调低可减少对其它内容的遮挡（40%–100%）。</div>
          <div class="slider-row">
            <input id="opacity-input" class="slider" type="range" min="40" max="100" step="5" value="100" />
            <span id="opacity-value" class="field__hint">100%</span>
          </div>
        </section>

        <section class="field">
          <div class="field__label">数据位置</div>
          <div id="data-root" class="field__hint field__hint--mono"></div>
          <div id="diagnostics-line" class="field__hint"></div>
        </section>

        <section class="field field--danger">
          <div class="field__label">清空历史</div>
          <div class="field__hint">将删除所有未置顶记录，置顶记录会保留。此操作需要确认。</div>
          <button id="clear-button" class="danger-button" type="button">清空历史（保留置顶）</button>
        </section>
      </div>
    </div>

    <div id="confirm-dialog" class="modal" hidden>
      <div class="modal__box" role="alertdialog" aria-labelledby="confirm-title">
        <h3 id="confirm-title" class="modal__title">确认清空历史？</h3>
        <p class="modal__text">将删除所有未置顶记录，置顶记录会保留。此操作不可撤销。</p>
        <div class="modal__actions">
          <button id="confirm-cancel" class="text-button" type="button">取消</button>
          <button id="confirm-ok" class="danger-button" type="button">确认清空</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden>
      <span id="toast-text"></span>
      <button id="toast-action" class="toast__action" type="button" hidden>撤销</button>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
