name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先看 [docs/需求规格说明书.md](../../blob/main/docs/需求规格说明书.md) 的
        「范围外清单」——本项目刻意保持轻量，部分功能已被明确排除并附有理由。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述场景与痛点，而不只是「加一个按钮」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
    validations:
      required: false
