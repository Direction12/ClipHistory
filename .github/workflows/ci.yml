name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧运行自动取消，节省配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 + 单元测试
    runs-on: windows-latest

    steps:
      - name: 检出
        uses: actions/checkout@v7

      # 测试入口 test/run-tests.mjs 依赖 node:module 的 registerHooks，
      # 该 API 要求 Node >= 24（见 docs/构建与运行.md §2.4）。
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test
